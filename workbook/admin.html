<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMP5423 · class report</title>
<style>
:root{
  --bg:#fbfaf8; --card:#fff; --ink:#1a1a1a; --dim:#6b6b6b; --faint:#9a9a9a; --line:#e5e2dc;
  --accent:#1a5c4a; --mark:#2f7d66;
  --good:#1a6b4a; --good-bg:#e6f2ec; --warn:#8a6a1f; --warn-bg:#f7f0dd; --crit:#9c3b3b; --crit-bg:#f7e9e9;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16181a; --card:#1e2124; --ink:#e8e6e3; --dim:#9a9a9a; --faint:#6f7478; --line:#2e3236;
    --accent:#6fbfa3; --mark:#4f9e84;
    --good:#7ec9a8; --good-bg:#1b2b25; --warn:#d8bd77; --warn-bg:#2c2718; --crit:#e59a9a; --crit-bg:#2e1f1f; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
main{max-width:56rem;margin:0 auto;padding:1.5rem 1rem 4rem}
h1{font-size:1.15rem;margin:0}
h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);
   margin:2.2rem 0 .6rem;font-weight:600}
.dim{color:var(--dim)}.faint{color:var(--faint)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:.4rem .8rem;cursor:pointer}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:.55rem .8rem;letter-spacing:.1em}

/* stat tiles — hero numbers, no plot, so no hover layer */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.6rem;margin-top:.8rem}
.tile{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:.85rem .95rem}
.tile b{display:block;font-size:1.9rem;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--dim)}
.tile .of{font-size:1rem;color:var(--faint);font-weight:400}

table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-weight:600;color:var(--faint);font-size:.75rem;letter-spacing:.05em;
   text-transform:uppercase;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
td{padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:.3rem .6rem}

/* status: never colour alone — a dot AND a word */
.st{display:inline-flex;align-items:center;gap:.4rem;white-space:nowrap}
.st i{width:.55rem;height:.55rem;border-radius:50%;flex:none}
.st.good i{background:var(--good)} .st.good{color:var(--good)}
.st.warn i{background:var(--warn)} .st.warn{color:var(--warn)}
.st.crit i{background:var(--crit)} .st.crit{color:var(--crit)}

/* one series, so no legend; direct labels only */
.bar{position:relative;height:1.05rem;background:var(--line);border-radius:4px;min-width:3rem}
.bar>i{position:absolute;inset:0 auto 0 0;background:var(--mark);border-radius:4px}
.miss{font-size:.88rem}
.tag{font-size:.72rem;color:var(--faint);background:var(--line);padding:.1rem .4rem;border-radius:5px}
.err{color:var(--crit)}
</style>
</head>
<body><main id="app"></main>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
