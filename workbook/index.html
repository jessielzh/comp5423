<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMP5423 workbook</title>
<style>
:root{
  --bg:#fbfaf8; --card:#fff; --ink:#1a1a1a; --dim:#6b6b6b; --line:#e5e2dc;
  --accent:#1a5c4a; --good:#1a5c4a; --bad:#a33; --good-bg:#e8f2ee; --bad-bg:#f9ecec;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#16181a; --card:#1e2124; --ink:#e8e6e3; --dim:#9a9a9a; --line:#2e3236;
         --accent:#6fbfa3; --good:#6fbfa3; --bad:#e08b8b; --good-bg:#1c2b26; --bad-bg:#2b1e1e; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1rem 4rem}
h1{font-size:1.1rem;margin:0 0 .2rem}
.dim{color:var(--dim);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin:.75rem 0}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:.7rem .9rem;width:100%;text-align:left;cursor:pointer;
  margin:.4rem 0;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.995)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);text-align:center;font-weight:600}
button:disabled{cursor:default;opacity:1}
button.good{background:var(--good-bg);border-color:var(--good)}
button.bad{background:var(--bad-bg);border-color:var(--bad)}
.row{display:flex;gap:.5rem}.row>button{margin:.4rem 0}
.math{overflow-wrap:break-word}
.math sub,.math sup{font-size:.72em;line-height:0}
input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:.7rem .9rem;width:100%;letter-spacing:.12em}
.reveal{display:flex;gap:.5rem;align-items:stretch}
.reveal input{flex:1}
.reveal button{width:auto;margin:0;padding:.7rem .9rem;font-size:.85rem;white-space:nowrap}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin:.3rem 0 .1rem}
.bar>i{display:block;height:100%;background:var(--accent)}
.q{font-size:1.06rem;margin:.2rem 0 1rem}
/* Sample text inside a stem. Wide lines scroll inside the box; the page never does. */
.ex{font:.86rem/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(127,127,127,.10);border-left:3px solid var(--line);border-radius:4px;padding:.6rem .75rem;margin:0 0 1rem;overflow-x:auto;white-space:pre}
.why{border-left:3px solid var(--line);padding-left:.85rem;margin:1rem 0;color:var(--dim);font-size:.94rem}
.pills{display:flex;gap:.4rem;flex-wrap:wrap;margin:.5rem 0}
.pills button{width:auto;padding:.35rem .7rem;font-size:.85rem;border-radius:20px;margin:0}
.pills button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.opt{border:1px solid var(--line);border-radius:9px;padding:.5rem .7rem;margin:.3rem 0;font-size:.94rem}
code.ref{font-size:.78rem;color:var(--dim);background:none;padding:0;white-space:nowrap}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin:.8rem 0 0}
.acts button{margin:0}
button.flag{width:auto;margin:.8rem 0 0;padding:.35rem .7rem;font-size:.82rem;border-radius:20px}
button.flag[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
code{background:var(--line);padding:.1em .35em;border-radius:4px;font-size:.9em}
.err{color:var(--bad);font-size:.88rem;margin:.5rem 0 0}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.top button{width:auto;margin:0;padding:.3rem .6rem;font-size:.8rem;border-radius:8px}
</style>
</head>
<body>
<main id="app"></main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
